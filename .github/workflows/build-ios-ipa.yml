name: Build OpenMinis clone iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - name: Checkout official source and submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Install native build tools
        run: |
          brew install meson ninja llvm lld libarchive pkg-config
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Set up Go for official Rclone build
        uses: actions/setup-go@v5
        with:
          go-version-file: deps/rclone-mobile/go.mod
          cache-dependency-path: deps/rclone-mobile/go.sum

      - name: Prepare provider customization
        run: |
          cp src/ios/Configs/ProviderCustomization.xcconfig.example \
             src/ios/Configs/ProviderCustomization.xcconfig

      - name: Patch iSH VDSO linker path for macOS
        run: |
          lld_prefix="$(brew --prefix lld)"
          test -x "$lld_prefix/bin/ld.lld"
          sed -i '' "s#'-fuse-ld=lld'#'-fuse-ld=$lld_prefix/bin/ld.lld'#" \
            deps/ish/vdso/arm64/meson.build
          grep -F -- "-fuse-ld=$lld_prefix/bin/ld.lld" \
            deps/ish/vdso/arm64/meson.build

      - name: Build iOS native dependencies
        run: |
          ./deps/build_lame.sh
          ./deps/build_ffmpeg.sh
          ./deps/build_rclone_ios.sh
          ./deps/build_ish.sh release
          ./deps/prepare_alpine_rootfs.sh

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project src/ios/Minis.xcodeproj \
            -scheme Minis

      - name: Build tests (compile gate)
        run: |
          xcodebuild build-for-testing \
            -project src/ios/Minis.xcodeproj \
            -scheme Minis \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      # [04b-2 §7] `build-for-testing` only COMPILES the test target — it never
      # runs a single assertion, which is how a test that could never pass
      # survived three rounds. The simulator cannot run the XCTest bundle here:
      # the native deps (lame/ffmpeg/rclone/ish) are device-only slices, so
      # `test-without-building` against a simulator destination cannot link.
      # The standalone suite is a plain Swift script with no app graph, so run
      # it for real — that is where the theme-pack assertions live.
      - name: Run standalone source assertions
        run: |
          set -euo pipefail
          cd src/ios/MinisTests/Standalone
          # Every file here is written to run on its own (`swift <file>.swift`)
          # and exits non-zero on failure. Only the theme-pack suite is wired
          # in so far — it is the one whose assertions this branch actually
          # touched and re-verified. The other nine exist but have never been
          # executed by CI, so enabling them blind would just trade a silent
          # gap for a red build nobody can attribute. Add them one at a time.
          /usr/bin/swift AppearanceThemePackTests.swift

      - name: Archive OpenMinis clone app unsigned
        run: |
          mkdir -p build
          xcodebuild archive \
            -project src/ios/Minis.xcodeproj \
            -scheme Minis \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/OpenMinis.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          app="build/OpenMinis.xcarchive/Products/Applications/Minis.app"
          test -d "$app"
          mkdir -p build/Payload
          cp -R "$app" build/Payload/OpenMinis.app
          # A valid IPA must have Payload/OpenMinis.app at the archive root.
          # Zipping from inside Payload produced a root-level OpenMinis.app,
          # which sideloaders reject.
          cd build
          /usr/bin/zip -qry OpenMinis-clone-unsigned.ipa Payload
          cd ..
          /usr/bin/file build/OpenMinis-clone-unsigned.ipa
          /usr/bin/du -h build/OpenMinis-clone-unsigned.ipa

      - name: Upload OpenMinis clone IPA
        uses: actions/upload-artifact@v4
        with:
          name: OpenMinis-clone-iOS-unsigned-${{ github.run_number }}
          path: build/OpenMinis-clone-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
